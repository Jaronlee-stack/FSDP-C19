services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-jaron}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-FSDP}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/docker:/docker-entrypoint-initdb.d:ro
      - ./database:/app-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-FSDP}
      DB_USER: ${DB_USER:-jaron}
      DB_PASSWORD: ${DB_PASSWORD}
      BEN_VAULT_PATH: /ben-vault
    volumes:
      - ./Ben Bot:/ben-vault:ro
    ports:
      - "${APP_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
