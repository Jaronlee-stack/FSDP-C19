<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="imports" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="imports">
        <div class="page-h"><div><h1>Import issues</h1><p>Rows from spreadsheet imports that were incomplete, unmatched or could not be read. Match each one to a member, or dismiss it.</p></div></div>
        <!-- DEBUG PANEL (placeholder): a control to load a sample CSV import with missing information, unmatched names and a pipeline error so this list can be demonstrated. The import pipeline itself is not built yet. -->
        <div class="g3" id="impStats"></div>
        <div class="list-bar"><div class="filters" id="impTabs"><button class="fpill on" data-f="open">Open<span class="n" id="nOpen">0</span></button><button class="fpill" data-f="fixed">Fixed<span class="n" id="nFixed">0</span></button><button class="fpill" data-f="dismissed">Dismissed<span class="n" id="nDismissed">0</span></button></div></div>
        <div class="card white"><div class="rows" id="impRows"></div></div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/api.js" data-then="../js/store.js,admin-data-desk.js,admin-data-business.js,../js/portal.js,admin-shell.js,admin-desk.js,admin-business.js"></script>
</body>
</html>
