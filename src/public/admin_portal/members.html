<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="members" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="members">
        <div class="page-h"><div><h1>Members</h1><p id="memSub"></p></div><div class="acts"><button class="sbtn" data-export="members" data-ba><svg class="ic"><use href="#i-download"/></svg>Export CSV</button></div></div>
        <div class="list-bar">
          <div class="filters" id="memFilter"></div>
          <label class="search list-search"><svg class="ic"><use href="#i-search"/></svg><input id="memSearch" type="search" placeholder="Name, member no., phone, email or guardian" aria-label="Search members" autocomplete="off"></label>
        </div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Member</th><th>Belt</th><th>Centre</th><th>Package</th><th>Membership</th><th>Last seen</th></tr></thead><tbody id="memRows"></tbody></table></div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/api.js" data-then="../js/store.js,admin-data-desk.js,../js/portal.js,admin-shell.js,admin-desk.js,admin-members.js"></script>
</body>
</html>
