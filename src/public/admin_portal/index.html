<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A folder URL without the trailing slash (e.g. /src/public/landingpage, as `npx serve` shows it) would make every
     relative link point one folder too high. Send the browser to the slash version first, before anything loads. -->
<script>(function () { var l = location, p = l.pathname; if (/\/index$/.test(p)) p = p.slice(0, -5); else if (/\/$|\.html?$/.test(p)) return; else p += '/'; l.replace(p + l.search + l.hash); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="dashboard" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="dashboard">
        <!-- Front desk home: drawn by admin-desk.js renderToday(). For a Business Admin it moves into the Overview (Today at HQ). -->
        <div id="fdHome" class="page-body" style="display:grid;gap:14px">
          <div class="page-h"><div><h1>Today</h1><p id="fdDate">HQ Dojo</p></div>
            <div class="acts wrap"><a class="sbtn" href="register.html">New registration</a><button class="sbtn" id="fdPay">Take payment</button><button class="sbtn" id="fdFind">Find student</button><button class="sbtn dark" id="fdWalk">Walk-in guest</button></div></div>
          <div class="g4" id="fdStats"></div>
          <div class="g-wide">
            <div class="card"><div class="card-h"><div><h3>Today's sessions</h3><span class="sub">HQ Dojo classes</span></div></div><div class="ag-list" id="fdSessions"></div></div>
            <div class="card"><div class="card-h"><h3>Waiting on you</h3></div><div class="rows" id="fdWaiting"></div></div>
          </div>
        </div>
        <!-- Business Admin Overview: drawn by admin-business.js -->
        <div id="baHome" data-ba style="display:grid;gap:14px">
          <div class="page-h"><div><h1>Overview</h1><p id="baSub">All centres</p></div>
            <div class="acts wrap">
              <div class="fld" style="min-width:170px"><select id="baPeriod" aria-label="Period"><option value="month">This month</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select></div>
              <div class="view-toggle" id="baView"><button class="on" data-bv="org">Organisation</button><button data-bv="today">Today at HQ</button></div>
            </div></div>
          <div id="baOrg" style="display:grid;gap:14px">
            <div class="g4" id="baStats"></div>
            <div class="g-wide">
              <div class="card"><div class="card-h"><div><h3>Centres at a glance</h3><span class="sub">Occupancy from the timetable. Trend and sign-in figures are sample data.</span></div></div><div class="rows" id="baCentres"></div></div>
              <div class="card"><div class="card-h"><h3>Waiting on you</h3></div><div class="rows" id="baWaiting"></div></div>
            </div>
            <div><h3 style="margin:4px 0 10px">Questions to answer</h3><div class="g4" id="baQuestions"></div></div>
          </div>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/portal.js"></script>
<script src="admin-shell.js"></script>
<script src="admin.js"></script>
<script src="admin-desk.js"></script>
<script src="admin-business.js"></script>
</body>
</html>
