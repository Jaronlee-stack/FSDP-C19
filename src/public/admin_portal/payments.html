<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="payments" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="payments">
        <div class="page-h"><div><h1>Payments</h1><p>Stripe · November 2026</p></div><div class="acts"><label class="search list-search"><svg class="ic"><use href="#i-search"/></svg><input id="paySearch" type="search" placeholder="Search member or item" aria-label="Search member or item" autocomplete="off"></label></div></div>
        <div class="g3 ac" data-stagger>
          <div class="stat dark"><span class="l">Revenue this month</span><span class="v">S$<span data-count="42600" data-sep>0</span></span><span class="h">+8% on October</span></div>
          <div class="stat alert"><span class="l">Lapsed accounts</span><span class="v"><span data-count="7">0</span></span><span class="h">Booking locked</span></div>
          <div class="stat"><span class="l">Processing</span><span class="v"><span data-count="3">0</span></span><span class="h">Pending on Stripe</span></div>
        </div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Member</th><th>Item</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody id="adminPayRows"></tbody></table></div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/portal.js"></script>
<script src="admin.js"></script>
</body>
</html>
