<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="payments" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="payments">
        <div class="page-h"><div><h1>Payments</h1><p id="payHead">Stripe</p></div><div class="acts wrap"><label class="search list-search"><svg class="ic"><use href="#i-search"/></svg><input id="paySearch" type="search" placeholder="Search member or item" aria-label="Search member or item" autocomplete="off"></label><button class="sbtn dark" id="payTake"><svg class="ic"><use href="#i-plus"/></svg>Take payment</button></div></div>
        <div class="g3" id="payStats"></div>
        <div class="list-bar"><div class="filters" id="payTabs"></div></div>
        <!-- DEBUG PANEL (placeholder): a control to make a Stripe auto-payment fail (for example an Unlimited plan renewal) so the Failed payments list can be demonstrated. Not built yet. -->
        <div class="tbl-wrap" id="payTblWrap"><table class="tbl"><thead><tr><th>Member</th><th>Item</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="payRows"></tbody></table></div>
        <div class="card" id="payOther" hidden></div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/api.js" data-then="../js/store.js,admin-data-desk.js,../js/portal.js,admin-shell.js,admin-desk.js"></script>
</body>
</html>
