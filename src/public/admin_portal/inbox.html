<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Inbox · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="admin" data-page="inbox" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="inbox">
        <div class="page-h"><div><h1>Inbox</h1><p>Questions the dojo assistant, Ben, was not sure about. Reply here. A reply goes back to the person on Telegram, and you can choose whether it also goes into the FAQ or a knowledge note.</p></div></div>
        <div class="g-side">
          <div class="card white">
            <div class="list-bar"><div class="filters" id="ibTabs"><button class="fpill on" data-f="open">Waiting</button><button class="fpill" data-f="answered">Answered</button></div></div>
            <div class="rows" id="ibRows"></div>
            <p class="sub" id="ibEmpty" hidden></p>
          </div>
          <div class="card white">
            <p class="sub" id="ibDetailEmpty">Choose a question on the left.</p>
            <div id="ibDetail" hidden>
              <div id="ibInfo"></div>
              <div id="ibFormWrap">
                <div class="fld"><label for="ibChoice">What should happen</label><select id="ibChoice"></select></div>
                <div class="fld" id="ibNoteWrap" hidden><label for="ibNote">Knowledge note to update</label><input id="ibNote" maxlength="120" placeholder="e.g. Fees and Packages"></div>
                <div class="fld"><label for="ibReply">Reply</label><textarea id="ibReply" rows="5" maxlength="1500" placeholder="Write the answer as it should be sent."></textarea><span class="hint" id="ibHint"></span></div>
                <button class="btn" type="button" id="ibSend" style="justify-self:start">Send reply</button>
              </div>
              <div id="ibAnswered" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/api.js" data-then="../js/store.js,admin-data-desk.js,admin-data-business.js,../js/portal.js,admin-shell.js,admin-desk.js,admin-inbox.js,admin-business.js"></script>
</body>
</html>
