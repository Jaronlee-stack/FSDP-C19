<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Instructor · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="instructor" data-page="profile" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="profile">
        <div class="page-h"><div><h1>Profile</h1><p>Your details, and what students say about your classes.</p></div></div>
        <div class="ins-grid">
          <div class="ins-profile">
          <div class="pcard icard" id="insCard"><div class="pcard-body"><div class="pcard-tile"><span class="pcard-holo"></span>
            <div class="icard-photo"><span class="ini" aria-hidden="true">BT</span></div>
            <span class="icard-org"><img src="https://aikidoshinjukai.com.sg/images/logo.png" alt="">SHINJU-KAI</span><span class="icard-kanji" aria-hidden="true">先生</span>
            <div class="icard-id"><div class="pcard-name">Bob Tan Sensei</div><div class="pcard-rank"><i></i>6th Dan</div></div>
            <span class="pcard-glare"></span></div>
            <ul class="icard-info">
              <li><svg class="ic"><use href="#i-award"/></svg><span>6th Dan · Black belt</span></li>
              <li><svg class="ic"><use href="#i-id"/></svg><span>Instructor ID · ASK-INS-0042</span></li>
              <li><svg class="ic"><use href="#i-pin"/></svg><span>HQ · Thomson</span></li>
            </ul>
          </div></div>
        </div>
          <div class="ins-main">
            <div class="stats" id="insStats"></div>
            <div class="card white">
              <div class="card-h"><div><h2>Student ratings</h2><span class="sub">Out of 5 stars, given after each class.</span></div></div>
              <div id="fbSummary"></div>
            </div>
            <div class="card white">
              <div class="card-h"><div><h2>Written comments</h2><span class="sub" id="fbCount"></span></div></div>
              <div class="fb-list" id="fbList"></div>
            </div>
          </div>
        </div>
        <div class="acct-bar">
          <button class="sbtn" id="pwBtn"><svg class="ic"><use href="#i-lock"/></svg>Change password</button>
          <button class="sbtn" id="forgotPw"><svg class="ic"><use href="#i-lock"/></svg>Forgot password</button>
          <button class="sbtn" data-logout><svg class="ic"><use href="#i-logout"/></svg>Sign out</button>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/api.js" data-then="../js/store.js,instructor-data.js,../js/portal.js,instructor.js"></script>
</body>
</html>
