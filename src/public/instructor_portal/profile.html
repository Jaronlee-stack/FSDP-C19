<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Instructor · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="instructor" data-page="profile" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="profile">
        <div class="page-h"><div><h1>Profile</h1></div></div>
        <div class="ins-profile">
          <div class="pcard icard" id="insCard"><div class="pcard-body"><div class="pcard-tile"><span class="pcard-holo"></span>
            <div class="icard-photo"><img src="https://aikidoshinjukai.com.sg/images/instructors/bob-tan.jpg" alt="Bob Tan Sensei" onerror="this.remove()"><span class="ini" aria-hidden="true">BT</span></div>
            <span class="icard-org"><img src="https://aikidoshinjukai.com.sg/images/logo.png" alt="">SHINJU-KAI</span><span class="icard-kanji" aria-hidden="true">先生</span>
            <div class="icard-id"><div class="pcard-name">Bob Tan Sensei</div><div class="pcard-rank"><i></i>6th Dan</div></div>
            <span class="pcard-glare"></span></div>
            <ul class="icard-info">
              <li><svg class="ic"><use href="#i-award"/></svg><span>General Affairs Council · IAD Senior Director</span></li>
              <li><svg class="ic"><use href="#i-pin"/></svg><span>HQ · Thomson</span></li>
              <li><svg class="ic"><use href="#i-mail"/></svg><span>bob.tan@aikidoshinjukai.com.sg</span></li>
            </ul>
          </div></div>
          <button class="sbtn ghost" data-logout><svg class="ic"><use href="#i-logout"/></svg>Sign out</button>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/portal.js"></script>
<script src="instructor.js"></script>
</body>
</html>
