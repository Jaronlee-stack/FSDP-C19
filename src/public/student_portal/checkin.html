<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Folder pages can be opened as /site/student (no trailing slash), e.g. by `npx serve`.
     Relative links would then point one folder too high, so pin the base to this folder. -->
<script>(function () { var p = location.pathname; if (!/\/$|\.html?$/.test(p)) document.write('<base href="' + p + '/">'); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Checked in · Student · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="student" data-page="checkin" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="checkin">
        <div class="ci-wrap ac">
          <div class="ci-card">
            <span class="ci-ring" aria-hidden="true"></span>
            <span class="ci-seal" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></span>
            <span class="eyebrow ci-eyebrow">Check-in confirmed</span>
            <h1 class="ci-title">You're checked in</h1>
            <p class="ci-sub" id="ciSub">Attendance recorded. Enjoy your class on the mat.</p>

            <div class="ci-detail" id="ciDetail"></div>

            <div class="ci-meta">
              <div><span>Member</span><b id="ciMember">—</b></div>
              <div><span>Member no.</span><b class="num" id="ciNo">—</b></div>
              <div><span>Checked in at</span><b id="ciTime">—</b></div>
            </div>

            <div class="ci-acts">
              <a class="btn btn-red arrow" href="index.html" data-ci-home>Back to dashboard<span class="dot"><svg class="ic"><use href="#i-arrow"/></svg></span></a>
              <a class="sbtn" href="book.html">View my classes</a>
            </div>
          </div>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ben.js"></script>
<script src="../js/portal.js"></script>
<script src="student.js"></script>
</body>
</html>
