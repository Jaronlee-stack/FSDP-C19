<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Scan to check in · Student · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body data-portal="student" data-page="scan" data-root="../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="scan">
        <!-- full-screen camera. Opens straight away from the Scan tab and the "Scan QR to check in" button on the membership card. -->
        <div class="scan" id="scan" aria-labelledby="scanTitle">
          <video id="scanVideo" playsinline muted autoplay></video>

          <div class="scan-top">
            <a class="scan-round" href="index.html" id="scanClose" aria-label="Close scanner"><svg class="ic"><use href="#i-x"/></svg></a>
          </div>

          <div class="scan-mid" id="scanMid">
            <p class="scan-title" id="scanTitle">Scan the class QR code</p>
            <div class="scan-frame" id="scanFrame">
              <i></i><i></i><i></i><i></i>
              <span class="scan-line" aria-hidden="true"></span>
              <span class="scan-ok" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span>
            </div>
            <p class="scan-hint" id="scanHint" aria-live="polite">Starting camera…</p>
          </div>

          <!-- shown instead of the frame when the camera can't start -->
          <div class="scan-msg" id="scanMsg" hidden>
            <span class="scan-msg-ic"><svg class="ic"><use href="#i-scan"/></svg></span>
            <h2 id="scanMsgT">Camera not available</h2>
            <p id="scanMsgP"></p>
            <div class="scan-msg-acts">
              <button type="button" class="btn btn-red" id="scanRetry">Try again</button>
            </div>
          </div>

          <div class="scan-bot">
            <button type="button" class="scan-pill" id="scanManual"><svg class="ic"><use href="#i-edit"/></svg>Enter code instead</button>
            <button type="button" class="scan-round" id="scanTorch" aria-pressed="false" aria-label="Turn on flashlight" hidden><svg class="ic"><use href="#i-bolt"/></svg></button>
          </div>
        </div>
      </section>
    </main>
</div>

<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ben.js"></script>
<script src="../js/portal.js"></script>
<script src="../js/vendor/jsQR.js"></script>
<script src="student.js"></script>
</body>
</html>
