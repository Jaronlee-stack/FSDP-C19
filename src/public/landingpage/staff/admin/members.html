<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Admin · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/portal.css">
</head>
<body data-portal="admin" data-page="members" data-root="../../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="members">
        <div class="page-h"><div><h1>Members</h1><p>1,248 active across 60+ dojos.</p></div><div class="acts"><button class="sbtn" data-export="members"><svg class="ic"><use href="#i-download"/></svg>Export CSV</button></div></div>
        <div class="list-bar">
          <div class="filters" id="memFilter"></div>
          <label class="search list-search"><svg class="ic"><use href="#i-search"/></svg><input id="memSearch" placeholder="Search name or member no." aria-label="Search members"></label>
        </div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Member</th><th>Grade</th><th>Dojo</th><th>Hours</th><th>Membership</th></tr></thead><tbody id="memRows"></tbody></table></div>
      </section>
    </main>
</div>

<script src="../../js/core.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/portal.js"></script>
<script src="../../js/admin.js"></script>
</body>
</html>
