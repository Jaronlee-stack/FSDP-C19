<!doctype html>
<!-- FILE: staff/instructor/index.html — instructor Today page -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Folder pages can be opened as /site/student (no trailing slash), e.g. by `npx serve`.
     Relative links would then point one folder too high, so pin the base to this folder. -->
<script>(function () { var p = location.pathname; if (!/\/$|\.html?$/.test(p)) document.write('<base href="' + p + '/">'); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213B">
<title>Instructor · Aikido Shinju-Kai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/portal.css">
</head>
<body data-portal="instructor" data-page="today" data-root="../../">

<div class="shell">
    <main class="main">
      <section class="page on" data-page="today">
        <div class="page-h"><div><h1>Today · Mon 3 Nov</h1><p>Attendance opens 30 minutes before each class.</p></div></div>
        <div class="g-side g-even">
          <div class="live-card ac">
            <span class="tag">Active now</span>
            <h2>Adults · 7:00 – 8:00 PM</h2>
            <div class="meta"><span>HQ Dojo, Mat A</span><span><b id="presentCount">0</b> of 14 checked in</span></div>
            <div class="code"><svg class="ic"><use href="#i-nfc"/></svg>Session code <b>HQ-7PM-4821</b></div>
            <div><button class="sbtn" data-inst-tab="roster">Open roster</button></div>
          </div>
          <div class="card ac">
            <div class="card-h"><h3>Your day</h3></div>
            <div class="rows" id="dayList"></div>
          </div>
        </div>
        <div class="card white ac">
          <div class="card-h"><div><h3>Roster · Adults 7 PM</h3><span class="sub">Tap to mark present. Students tapping the NFC tag are marked automatically.</span></div><div class="card-h-acts"><label class="search list-search"><svg class="ic"><use href="#i-search"/></svg><input id="rosterSearch" type="search" placeholder="Search roster" aria-label="Search roster" autocomplete="off"></label><button class="sbtn" id="markAll"><svg class="ic"><use href="#i-check"/></svg>Mark all present</button></div></div>
          <div class="rows" id="roster"></div>
        </div>
      </section>
    </main>
</div>

<script src="../../js/core.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/store.js"></script>
<script src="../../js/portal.js"></script>
<script src="../../js/instructor.js"></script>
</body>
</html>
